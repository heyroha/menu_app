<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>오늘의 식탁</title>
    <meta name="theme-color" content="#FFFDF8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 색연필 필터
         #wobble: 선을 살짝 흔든다 (그림 본체, 불투명)
         #pencil-grain: 그 위에 갈색 결을 얹어 색연필로 칠한 질감을 낸다 (면 밖으로는 안 나감) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="pencil-grain" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.95 0.3" numOctaves="2" seed="3" result="n" />
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.23  0 0 0 0 0.16  -3.2 0 0 0 1.75" result="speck" />
        <feComposite in="speck" in2="SourceAlpha" operator="in" />
      </filter>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="2" />
        <feDisplacementMap in="SourceGraphic" scale="2.4" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
